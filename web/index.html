<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PlanWell</title>
  <meta name="description" content="A gentle check before each activity, based on your own past days.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F0F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191827" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="#/today" aria-label="PlanWell, go to Today">
        <svg class="wordmark-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <path d="M5 19 h22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="16" cy="12" r="3.5" fill="currentColor"/>
        </svg>
        <span>PlanWell</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/today" data-nav="today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
          <span>Today</span>
        </a>
        <a href="#/next" data-nav="next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M12 10v10"/></svg>
          <span>Next 2 days</span>
        </a>
        <a href="#/check-now" data-nav="check-now">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          <span>Check now</span>
        </a>
        <a href="#/history" data-nav="learn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 4-7 5 5"/><path d="M3 21h18"/></svg>
          <span>Learn</span>
        </a>
        <a href="#/settings" data-nav="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
          <span>Settings</span>
        </a>
      </nav>
    </div>
  </header>

  <div class="demo-strip" id="demo-strip" hidden>
    <div class="demo-inner">
      <span class="demo-badge" id="demo-badge">Demo data</span>
      <fieldset class="scen">
        <legend class="sr-only">Demo scenario</legend>
        <span class="scen-item"><input type="radio" name="scenario" id="scen-good" value="good"><label for="scen-good">Good day</label></span>
        <span class="scen-item"><input type="radio" name="scenario" id="scen-meh" value="meh" checked><label for="scen-meh">Meh day</label></span>
        <span class="scen-item"><input type="radio" name="scenario" id="scen-poor" value="poor"><label for="scen-poor">Rough day</label></span>
      </fieldset>
      <button type="button" class="linkish" id="replay-tour">Replay tour</button>
    </div>
  </div>

  <main id="main" class="main" tabindex="-1">
    <div class="loading" role="status">Loading your day…</div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
